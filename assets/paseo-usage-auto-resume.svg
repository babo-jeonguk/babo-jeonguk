<svg xmlns="http://www.w3.org/2000/svg" width="570" height="260" viewBox="0 0 570 260" role="img" aria-labelledby="title desc">
<title id="title">Usage Auto Resume</title>
<desc id="desc">Concept illustration of a usage limit resetting and an agent resuming.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16283A"/><stop offset="1" stop-color="#0D1725"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5CE0C3"/><stop offset="1" stop-color="#6BAFE7"/></linearGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#7CA6BE" stroke-opacity=".08"/></pattern>
</defs>
<rect x=".5" y=".5" width="569" height="259" rx="16" fill="url(#bg)" stroke="#315066"/>
<rect x="1" y="1" width="568" height="258" rx="15" fill="url(#grid)"/>
<rect x="28" y="31" width="6" height="6" rx="2" fill="#63DDC4"/>
<text x="46" y="39" fill="#B1C8D7" font-family="Consolas,Menlo,monospace" font-size="14" letter-spacing="1.3">PASEO PLUGINS</text>
<path d="M28 58H542" stroke="#39536B" opacity=".7"/>
<g transform="translate(45 91)">
  <path d="M30 65H443" fill="none" stroke="#36586A" stroke-width="8" stroke-linecap="round"/>
  <path d="M30 65H443" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="190 20 75 60"/>
  <g fill="#162A3A" stroke="#77D9CF" stroke-width="3"><circle cx="31" cy="65" r="17"/><circle cx="220" cy="65" r="17"/><circle cx="444" cy="65" r="22"/></g>
  <path d="M23 65L29 71L40 58M212 65L218 71L229 58" fill="none" stroke="#80E8D0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M437 55L451 65L437 75" fill="none" stroke="#8FDEEE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Consolas,Menlo,monospace" font-size="15" fill="#B6D0DE" text-anchor="middle"><text x="31" y="110">LIMIT</text><text x="220" y="110">RESET</text><text x="444" y="110">RESUME</text></g>
</g>
</svg>